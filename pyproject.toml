[project]
name = "deepagent-skill-guardrails"
version = "0.1.0"
description = "Policy, scanner, and DeepAgents integration scaffold for governing Agent Skills."
requires-python = ">=3.10"
dependencies = [
  "pyyaml==6.0.3",
]

[project.scripts]
skill-guardrails = "deepagent_skill_guardrails.cli:main"

[project.optional-dependencies]
deepagents = [
  "deepagents==0.7.32",
  "langchain-mcp-adapters==0.3.2",
]
mcp = [
  "mcp==1.30.0",
]
judge = [
  "langchain==1.4.8",
]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
